name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  check:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./ismamstudio

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: ./ismamstudio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build check
        run: npm run build
