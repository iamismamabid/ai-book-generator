<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 216 54" width="216" height="54" role="img" aria-label="Featured on LaunchBuff">
  <!-- Container Background -->
  <rect width="216" height="54" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
  
  <!-- Subtle Glow Accent -->
  <rect x="1" y="1" width="214" height="52" rx="9" fill="none" stroke="rgba(245, 158, 11, 0.2)" stroke-width="1"/>

  <!-- LaunchBuff Icon Box (White Rounded Square) -->
  <g transform="translate(11, 10)">
    <!-- White outer icon container -->
    <rect width="34" height="34" rx="8" fill="#ffffff"/>
    
    <!-- Left vertical pill (LaunchBuff Orange) -->
    <rect x="7" y="7" width="6" height="20" rx="3" fill="#f59e0b"/>
    
    <!-- Top-right horizontal block (Dark Slate) -->
    <rect x="16" y="7" width="11" height="8.5" rx="2.5" fill="#0f172a"/>
    
    <!-- Bottom-right horizontal block (Dark Slate) -->
    <rect x="16" y="18.5" width="11" height="8.5" rx="2.5" fill="#0f172a"/>
  </g>

  <!-- Divider Line -->
  <line x1="56" y1="10" x2="56" y2="44" stroke="#334155" stroke-width="1" stroke-linecap="round"/>

  <!-- Text Block -->
  <g transform="translate(68, 0)">
    <!-- Top Subtitle: FEATURED ON -->
    <text x="0" y="21"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="9"
      font-weight="700"
      letter-spacing="1.5"
      fill="#94a3b8">FEATURED ON</text>
    
    <!-- Brand Wordmark: LAUNCHBUFF -->
    <text x="0" y="39"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="16"
      font-weight="900"
      letter-spacing="0.5">
      <tspan fill="#ffffff">LAUNCH</tspan><tspan fill="#f59e0b">BUFF</tspan>
    </text>
  </g>
</svg>
