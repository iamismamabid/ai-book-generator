[build]
builder = "NIXPACKS"
buildCommand = "npm ci --prefix ismamstudio && npm run build --prefix ismamstudio"

[deploy]
startCommand = "npm run start --prefix ismamstudio -- -p ${PORT:-3000}"
healthcheckPath = "/"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
